<!doctype html><html lang="th"><meta charset="utf-8"><title>3กอง — Visual QA</title><style>body{margin:0;background:#292b2a;color:white;font:14px sans-serif}header{padding:12px;display:flex;gap:12px;justify-content:center}iframe{display:block;border:0;margin:auto;background:#101713}button,select{padding:8px}</style><header><label>ขนาด <select id="size"><option value="390,844">390 × 844</option><option value="320,568">320 × 568</option><option value="430,932">430 × 932</option><option value="844,390">844 × 390</option><option value="768,1024">768 × 1024</option></select></label><label>หน้า <select id="view"><option value="/">แอปจริง</option><option value="/qa/online.html?player=0">ออนไลน์ emulator ผู้เล่น 1</option><option value="/qa/online.html?player=1">ออนไลน์ emulator ผู้เล่น 2</option><option value="/qa/lobby.html">Lobby ข้อมูลทดสอบ</option><option value="/qa/practice.html">ห้องซ้อมแยกจากบัญชี</option><option value="/qa/game.html">โต๊ะออนไลน์ ข้อมูลทดสอบ</option><option value="/qa/game.html?players=4">โต๊ะเพื่อน 4 คน ข้อมูลทดสอบ</option></select></label></header><iframe title="เกมทดสอบ" width="390" height="844" src="/"></iframe><script>const f=document.querySelector('iframe');document.querySelector('#size').onchange=e=>{[f.width,f.height]=e.target.value.split(',')};document.querySelector('#view').onchange=e=>{f.src=e.target.value};</script></html>
