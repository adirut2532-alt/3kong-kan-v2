name: Verify repaired owner login
on:
  push:
    branches: [codex/admin-password-reset]
    paths: ['.github/workflows/admin-password-reset.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9850506f160ed21eee3ccce3bbbedd57ef2f6685
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix functions
      - name: Clear owner throttle and verify token issuance
        env:
          DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEW_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_RESET }}
        run: |
          node <<'NODE'
          const admin=require('./functions/node_modules/firebase-admin');
          const crypto=require('node:crypto');
          (async()=>{
            if(!process.env.NEW_ADMIN_PASSWORD)throw Error('Reset secret not available');
            const key=JSON.parse(process.env.DEPLOY_CREDENTIAL||'{}');
            if(key.project_id!=='poker-kan')throw Error('Wrong project');
            admin.initializeApp({credential:admin.credential.cert(key),projectId:'poker-kan'});
            const limitId=crypto.createHash('sha256').update('account:admin_owner').digest('hex');
            await admin.firestore().doc('_authLimits/'+limitId).delete();
            const r=await fetch('https://us-central1-poker-kan.cloudfunctions.net/account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:{action:'adminLogin',password:process.env.NEW_ADMIN_PASSWORD}})});
            const body=await r.json();
            const result={http:r.status,status:body.error?.status||'OK',tokenIssued:typeof body.result?.token==='string'};
            console.log(JSON.stringify(result));
            if(!result.tokenIssued)throw Error('Owner login verification failed: '+result.status);
            console.log('Owner login repaired and verified. Password and token were not logged.');
          })().catch(e=>{console.error(e.message);process.exitCode=1}).finally(async()=>{if(admin.apps.length)await admin.app().delete()});
          NODE
