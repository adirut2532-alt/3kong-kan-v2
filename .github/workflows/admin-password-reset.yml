name: Diagnose owner login
on:
  push:
    branches: [codex/admin-password-reset]
    paths: ['.github/workflows/admin-password-reset.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9850506f160ed21eee3ccce3bbbedd57ef2f6685
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix functions
      - name: Diagnose login without exposing credentials or tokens
        env:
          DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEW_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_RESET }}
        run: |
          node <<'NODE'
          const {GoogleAuth}=require('./functions/node_modules/google-auth-library');
          (async()=>{
            if(!process.env.NEW_ADMIN_PASSWORD)throw Error('Reset secret not available');
            const started=new Date(Date.now()-60*60*1000).toISOString();
            const key=JSON.parse(process.env.DEPLOY_CREDENTIAL||'{}');
            if(key.project_id!=='poker-kan')throw Error('Wrong project');
            const auth=new GoogleAuth({credentials:key,scopes:['https://www.googleapis.com/auth/cloud-platform']});
            const client=await auth.getClient();
            try{
              const logs=await client.request({url:'https://logging.googleapis.com/v2/entries:list',method:'POST',data:{resourceNames:['projects/poker-kan'],filter:'resource.type="cloud_function" AND resource.labels.function_name="account" AND severity>=ERROR AND timestamp>="'+started+'"',orderBy:'timestamp desc',pageSize:20}});
              for(const entry of logs.data.entries||[]){
                const s=JSON.stringify(entry);
                console.log(JSON.stringify({check:'serverError',time:entry.timestamp,signBlob:s.includes('signBlob'),permissionDenied:/permission|PERMISSION_DENIED|insufficient-permission/i.test(s),iamApiDisabled:/iam.googleapis.com.*disabled|IAM API has not been used/i.test(s),credentialApiDisabled:/iamcredentials.googleapis.com.*disabled|IAM Service Account Credentials API has not been used/i.test(s),authCode:s.match(/auth\/[a-z-]+/)?.[0]||null}));
              }
            }catch(e){console.log(JSON.stringify({check:'serverLogs',http:e.response?.status||0}));}
            process.exitCode=1;
          })().catch(()=>{console.error('Diagnostic request failed; no secret values logged.');process.exitCode=1});
          NODE
