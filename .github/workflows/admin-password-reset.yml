name: Reset owner admin password once
on:
  push:
    branches: [codex/admin-password-reset]
    paths: ['.github/workflows/admin-password-reset.yml']
permissions:
  contents: read
concurrency:
  group: poker-kan-production
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9850506f160ed21eee3ccce3bbbedd57ef2f6685
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix functions
      - name: Reset only existing owner credentials
        env:
          DEPLOY_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEW_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_RESET }}
        run: |
          node <<'NODE'
          const admin=require('./functions/node_modules/firebase-admin');
          const crypto=require('node:crypto');
          const {promisify}=require('node:util');
          (async()=>{
            const password=process.env.NEW_ADMIN_PASSWORD;
            if(!password || password.length<12 || password.length>256)throw Error('Set ADMIN_PASSWORD_RESET repository secret to a new password of 12-256 characters.');
            const key=JSON.parse(process.env.DEPLOY_CREDENTIAL||'{}');
            if(key.project_id!=='poker-kan')throw Error('Wrong deployment project');
            admin.initializeApp({credential:admin.credential.cert(key),projectId:'poker-kan'});
            const db=admin.firestore();
            const salt=crypto.randomBytes(16).toString('hex');
            const hash=(await promisify(crypto.scrypt)(password,salt,64)).toString('hex');
            const refs=[db.doc('admin/config'),db.doc('config/admin')];
            const secret=db.doc('_credentials/admin_owner');
            const marker=db.doc('_deploymentBackups/admin-reset-20260909');
            await db.runTransaction(async tx=>{
              const [a,b,done]=await Promise.all([tx.get(refs[0]),tx.get(refs[1]),tx.get(marker)]);
              if(done.exists)return;
              if(!a.exists&&!b.exists)throw Error('No existing administrator; reset aborted.');
              if((a.exists?a:b).data().active===false)throw Error('Administrator disabled; reset aborted.');
              tx.set(secret,{salt,hash});
              [a,b].forEach((s,i)=>{if(s.exists)tx.update(refs[i],{passwordHash:admin.firestore.FieldValue.delete(),updatedAt:Date.now()});});
              tx.delete(db.doc('_authLimits/'+crypto.createHash('sha256').update('account:admin_owner').digest('hex')));
              tx.create(marker,{completedAt:Date.now(),operation:'Owner requested password reset',runId:process.env.GITHUB_RUN_ID});
            });
            const saved=(await secret.get()).data();
            const check=await promisify(crypto.scrypt)(password,saved.salt,64);
            if(!crypto.timingSafeEqual(Buffer.from(saved.hash,'hex'),check))throw Error('This reset was already used with a different password.');
            try{await admin.auth().revokeRefreshTokens('admin_owner');}catch(e){if(e.code!=='auth/user-not-found')throw e;}
            console.log('Administrator password reset verified. Members, balances and rooms unchanged.');
          })().catch(e=>{
            const allowed=['Set ADMIN_PASSWORD_RESET','Wrong deployment project','No existing administrator','Administrator disabled','This reset was already'];
            console.error(allowed.some(p=>e.message?.startsWith(p))?e.message:'Reset failed: '+(e.code||'request error'));
            process.exitCode=1;
          }).finally(async()=>{if(admin.apps.length)await admin.app().delete();});
          NODE
